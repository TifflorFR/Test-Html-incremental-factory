<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbre de recherche</title>
<style>
:root{
  --navy-900:#070d16; --navy-800:#0b1522; --navy-700:#101e30; --navy-600:#16293f;
  --line:#1e3149; --grid:rgba(120,170,220,.07);
  --brass:#c9963f; --brass-dim:#8a6829;
  --ember:#e8703a; --ember-dim:#7d3a1c;
  --steel:#8fa8bf; --ink:#dfe9f2;
  --ok:#5fb87a; --warn:#d8a13c; --bad:#c5533f;
  /* accents de branche — dérivés de la palette navy/laiton/ember, un ton distinct chacun */
  --br-spine:#c9963f;       /* laiton — l'épine dorsale reste la couleur "principale" du jeu */
  --br-extraction:#4fa8c9;  /* cyan sourd — forage / minage */
  --br-industrie:#e8703a;   /* ember — chaleur / industrie lourde */
  --br-spatial:#9b8fd9;     /* violet — orbite / labo */
  --br-placeholder:#3c4f66; /* gris-bleu neutre — étapes non encore atteintes */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    linear-gradient(rgba(120,170,220,.05) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, rgba(120,170,220,.05) 1px, transparent 1px) 0 0/32px 32px,
    radial-gradient(900px 600px at 70% -10%, #14263c 0%, var(--navy-900) 60%);
  color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;
  min-height:100vh; height:100vh; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
#top{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(7,13,22,.9);
  backdrop-filter:blur(3px);
}
#top .t{font-size:13px;letter-spacing:.1em;color:var(--brass)}
#top .sci{margin-left:auto;font-size:12px;color:var(--steel)}
#top .sci b{color:var(--ink)}
#top .close{border:1px solid var(--line);padding:5px 11px;font-size:11px;letter-spacing:.08em;
  color:var(--steel);border-radius:2px}
#top .close:hover{border-color:var(--brass-dim);color:var(--ink)}
#stage{
  position:relative;width:100%;height:calc(100% - 42px);overflow:auto;
  touch-action:pan-x pan-y;
}
#stage svg{display:block;margin:0 auto}
.branch-label{
  font-size:15px;letter-spacing:.14em;fill:var(--steel);opacity:.85;
  dominant-baseline:middle;
}
.link{stroke:var(--line);stroke-width:2;fill:none}
.link.done{stroke-width:2.4}
.node-hit{cursor:pointer}
.node-hit.locked{cursor:default}
.node-shape{transition:opacity .25s, filter .25s}
.node-shape.state-locked{opacity:.28}
.node-shape.state-dim{opacity:.55}
.node-shape.state-buyable{opacity:1}
.node-shape.state-done{opacity:.9}
.node-lock{opacity:.85}
.node-check{opacity:.95}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 1px var(--brass))}50%{filter:drop-shadow(0 0 7px var(--brass))}}
.node-shape.state-buyable{animation:pulse 2.6s ease-in-out infinite}
@keyframes reveal{0%{opacity:0;transform:scale(.7)}55%{opacity:1;filter:drop-shadow(0 0 12px var(--brass))}100%{filter:none}}
.node-group.revealing .node-shape{animation:reveal .7s ease-out}

.root-shape{fill:var(--navy-700);stroke:var(--brass);stroke-width:2.5}
.root-shape.state-buyable{animation:pulse 2.2s ease-in-out infinite}

#tip{
  position:fixed;z-index:20;max-width:230px;pointer-events:none;
  background:var(--navy-800);border:1px solid var(--brass-dim);padding:9px 11px;
  font-size:11.5px;line-height:1.5;border-radius:2px;opacity:0;transition:opacity .12s;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
#tip.show{opacity:1}
#tip .n{color:var(--ink);font-weight:600;margin-bottom:3px}
#tip .d{color:var(--steel);margin-bottom:6px}
#tip .row{display:flex;justify-content:space-between;gap:10px}
#tip .lab{color:var(--steel)}
#tip .ok{color:var(--ok)} #tip .bad{color:var(--bad)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--steel);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="top">
  <div class="t">ARBRE DE RECHERCHE</div>
  <div class="sci">science : <b id="sciVal">0</b></div>
  <button class="close" id="closeBtn">✕ fermer</button>
</div>
<div id="stage"><div id="empty" style="display:none"></div></div>
<div id="tip"></div>

<script>
/* ==========================================================================
   Copie fidèle de l'arbre de recherche calibré dans index.html (const RTREE).
   Ne pas modifier les coûts/effets ici sans les répercuter côté index.html —
   c'est la même source de vérité, dupliquée parce que ce fichier est autonome.
   ========================================================================== */
const RTREE=[
  {id:'B1',br:'spine',n:'Vaisseaux rudimentaires', sci:2480,  req:null, d:'Ouvre la construction de vaisseaux coloniaux.'},
  {id:'B2',br:'spine',n:'Colonisation',            sci:5460,  req:'B1', d:'JALON — débloque l\'étape 7.', milestone:7},
  {id:'B3',br:'spine',n:'Voyage interstellaire',   sci:145000,req:'B2', d:'Ouvre la portée interstellaire.'},
  {id:'B4',br:'spine',n:'Vaisseaux avancés',       sci:332000,req:'B3', d:'Coques capables de distorsion.'},
  {id:'B5',br:'spine',n:'Colonisation avancée',    sci:788000,req:'B4', d:'JALON — débloque l\'étape 8.', milestone:8},
  {id:'ND1',br:'spatial',n:'Chantier Dyson 1',sci:745,     req:null, dyson:'D1', d:'Ouvre le premier segment de la sphère.'},
  {id:'ND2',br:'spatial',n:'Chantier Dyson 2',sci:14500,   req:'ND1',dyson:'D2', d:'Deuxième segment.'},
  {id:'ND3',br:'spatial',n:'Chantier Dyson 3',sci:41500,   req:'ND2',dyson:'D3', d:'Troisième segment.'},
  {id:'ND4',br:'spatial',n:'Chantier Dyson 4',sci:3730000, req:'ND3',dyson:'D4', d:'Quatrième segment.'},
  {id:'ND5',br:'spatial',n:'Chantier Dyson 5',sci:10300000,req:'ND4',dyson:'D5', d:'Cinquième segment.'},
  {id:'ND6',br:'spatial',n:'Chantier Dyson 6',sci:27500000,req:'ND5',dyson:'D6', d:'Dernier segment.'},
  {id:'E1',br:'extraction',n:'Forage téléopéré',   sci:220, req:null, e:{stage:{1:3}},        d:'Extraction ×3.'},
  {id:'E2',br:'extraction',n:'Veines profondes',   sci:900, req:'E1', e:{stage:{1:4}},        d:'Extraction ×4.'},
  {id:'I1',br:'industrie', n:'Métallurgie orbitale',sci:260,req:null, e:{stage:{2:3,3:3}},    d:'Fonderie et usine ×3.'},
  {id:'I2',br:'industrie', n:'Cadence prédictive', sci:1100,req:'I1', e:{stage:{4:3,5:3}},    d:'National et international ×3.'},
  {id:'I3',br:'industrie', n:'Standardisation totale',sci:5200,req:'I2',e:{global:2},         d:'Production globale ×2.'},
  {id:'S1',br:'spatial',   n:'Assemblage en apesanteur',sci:300,req:null,e:{mult:{lab:2}},d:'Laboratoires ×2.'},
  {id:'S2',br:'spatial',   n:'Théorie unifiée',    sci:2400,req:'S1', e:{global:2},           d:'Production globale ×2.'},
  {id:'RS',br:'spatial',   n:'Optimisation de la recherche',sci:220,req:'S2',rep:true,repMult:1.62,e:{mult:{lab:1.22}},d:'+22 % de science par niveau.'},
  {id:'RI',br:'industrie', n:'Optimisation industrielle',   sci:260,req:'I3',rep:true,repMult:1.62,e:{stage:{5:1.22}},     d:'+22 % de production d\'étape 5 par niveau.'},
];
const RBY={}; RTREE.forEach(r=>RBY[r.id]=r);

/* Les 4 branches réelles de l'arbre existant (pas les 6 supposées par la maquette —
   voir note de livraison : Fonderie/Usine/National/International sont fusionnées dans
   "Industrie" côté données réelles). + 2 placeholders pour les étapes pas encore actives. */
const BRANCHES=[
  {id:'spine',      n:'Épine dorsale', angle:-90,  color:'--br-spine',      active:true},
  {id:'extraction', n:'Extraction',    angle:-25,  color:'--br-extraction', active:true},
  {id:'industrie',  n:'Industrie',     angle:35,   color:'--br-industrie',  active:true},
  {id:'spatial',    n:'Spatial',       angle:100,  color:'--br-spatial',    active:true},
  {id:'colonisation',n:'Colonisation (étape 7)',   angle:160, color:'--br-placeholder', active:false},
  {id:'expansion',  n:'Expansion galactique (étape 8)', angle:220, color:'--br-placeholder', active:false},
];

/* icônes par FONCTION, pas par nœud individuel — la forme reste fixe, seule la
   classe d'état (couleur/opacité) change en CSS */
function nodeIconType(r){
  if(!r) return 'root';
  if(r.milestone) return 'milestone';
  if(r.dyson) return 'segment';
  if(r.rep) return 'repeat';
  if(r.e && r.e.global) return 'global';
  if(r.e && r.e.mult) return 'machine';
  if(r.e && r.e.stage) return 'stage';
  return 'unlock';
}
function iconSvg(type,r){
  switch(type){
    case 'root': return '<circle r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle r="2.6" fill="currentColor"/>';
    case 'unlock': return '<rect x="-7" y="-5" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-4,-5 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="currentColor" stroke-width="2"/>';
    case 'milestone': return '<path d="M-6,8 V-8 l12,4 -12,4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
    case 'segment': return '<path d="M0,-9 A9,9 0 0 1 7.8,4.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle r="9" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/>';
    case 'stage': return '<circle r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4,-7 l4,-2 -1,4.4z" fill="currentColor"/>';
    case 'global': return '<circle r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-7,0 H7 M0,-7 V7 M-5,-4.5 Q0,-1 5,-4.5 M-5,4.5 Q0,1 5,4.5" fill="none" stroke="currentColor" stroke-width="1.3"/>';
    case 'machine': return '<path d="M0,-8 l2.3,1.3 2.6,-0.7 1.3,2.3 2.3,1.3 -0.7,2.6 1.3,2.3 -2.3,1.3 -0.7,2.6 -2.6,-0.7 -2.3,1.3 -1.3,-2.3 -2.6,0.7 -1.3,-2.3 -2.3,-1.3 0.7,-2.6 -1.3,-2.3 2.3,-1.3 0.7,-2.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" transform="scale(.62)"/><circle r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>';
    case 'repeat': return '<path d="M-6,-2 A6,6 0 1 1 -6,3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-6,3 l0,-5 l5,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
    default: return '<circle r="6" fill="none" stroke="currentColor" stroke-width="2"/>';
  }
}

/* ==========================================================================
   Sauvegarde partagée — même clé/format que index.html (STORE : window.storage
   si présent, sinon localStorage). Sous-objet dédié state.recherche pour l'état
   propre à cette page (déblocage du nœud racine), sans toucher au reste.
   ========================================================================== */
const SAVE_KEY='if:save', OLD_KEY='bn:save';
async function loadSave(){
  try{
    if(window.storage&&window.storage.get){
      const r=await window.storage.get(SAVE_KEY); if(r&&r.value) return JSON.parse(r.value);
      const o=await window.storage.get(OLD_KEY); if(o&&o.value) return JSON.parse(o.value);
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(OLD_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
async function writeSave(d){
  d.ts=Date.now();
  const raw=JSON.stringify(d);
  try{ if(window.storage&&window.storage.set){ await window.storage.set(SAVE_KEY,raw); return; } }catch(e){}
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
}

let SAVE=null;   // document JSON complet {v,ts,state,unlockedClicks}
let revealedIds=new Set();  // pour détecter les nœuds nouvellement visibles (flash)

function ensureShape(){
  SAVE=SAVE||{v:1,state:{}};
  SAVE.state=SAVE.state||{};
  SAVE.state.research=SAVE.state.research||{};
  SAVE.state.res=SAVE.state.res||{};
  SAVE.state.res.science=SAVE.state.res.science||0;
  SAVE.state.dyson=SAVE.state.dyson||{};
  SAVE.state.recherche=SAVE.state.recherche||{root:false};
  SAVE.state.stage=SAVE.state.stage||1;
}
function rLevel(id){ return SAVE.state.research[id]||0; }
function rDone(id){ return rLevel(id)>0; }
function rAvail(r){ return (!r.req||rDone(r.req)) && (r.rep||!rDone(r.id)); }
function rCost(r){ return r.rep ? Math.round(r.sci*Math.pow(r.repMult,rLevel(r.id))) : r.sci; }
function sci(){ return SAVE.state.res.science||0; }

async function buyRoot(){
  if(SAVE.state.recherche.root) return;
  if(sci()<1) return;
  SAVE.state.res.science-=1;
  SAVE.state.recherche.root=true;
  await writeSave(SAVE);
  fullRender();
}
async function buyNode(id){
  const r=RBY[id]; if(!r||!SAVE.state.recherche.root||!rAvail(r)) return;
  const c=rCost(r); if(sci()<c) return;
  SAVE.state.res.science-=c;
  SAVE.state.research[id]=rLevel(id)+1;
  if(r.dyson) SAVE.state.dyson[r.dyson]={open:true,paid:0,running:false,done:false};
  await writeSave(SAVE);
  fullRender();
}

/* ==========================================================================
   Construction de l'arbre — tige virtuelle par branche (gère les embranchements,
   ex: la branche "spatial" a deux chaînes indépendantes : Dyson et Labo), puis
   répartition angulaire récursive à l'intérieur du secteur de la branche.
   ========================================================================== */
function branchTree(brId){
  const nodes=RTREE.filter(r=>r.br===brId);
  const byParent={};
  nodes.forEach(r=>{
    const p = (r.req && RBY[r.req] && RBY[r.req].br===brId) ? r.req : '__stem__';
    (byParent[p]=byParent[p]||[]).push(r);
  });
  const build=id=>({id, r:RBY[id]||null, children:(byParent[id]||[]).map(c=>build(c.id))});
  return {id:'__stem__', r:null, children:(byParent['__stem__']||[]).map(c=>build(c.id))};
}
const BASE_R=150, STEP_R=100, SECTOR=48; // largeur angulaire d'un secteur de branche (degrés)
function layoutBranch(stem, centerAngle){
  const out=[]; const links=[];
  function place(node,a0,a1,depth,parentXY){
    const mid=(a0+a1)/2;
    let xy=parentXY;
    if(node.r){
      const rad=BASE_R+depth*STEP_R;
      const A=mid*Math.PI/180;
      xy=[Math.cos(A)*rad, Math.sin(A)*rad];
      out.push({node:node.r, x:xy[0], y:xy[1], depth});
      if(parentXY) links.push({from:parentXY,to:xy,node:node.r});
    }
    const n=node.children.length; if(!n) return;
    const span=(a1-a0)/n;
    node.children.forEach((c,i)=>place(c, a0+i*span, a0+(i+1)*span, depth+1, xy||parentXY));
  }
  place(stem, centerAngle-SECTOR/2, centerAngle+SECTOR/2, 0, null);
  return {nodes:out, links};
}

function nodeState(r){
  if(!SAVE.state.recherche.root) return 'locked';
  if(!rAvail(r)) return rDone(r.id) && !r.rep ? 'done' : 'locked';
  if(rDone(r.id) && !r.rep) return 'done';
  return sci()>=rCost(r) ? 'buyable' : 'dim';
}
/* visibilité progressive : acheté + prochain(s) nœud(s) achetables/verrouillés révélés */
function visibleNodes(brId){
  const stem=branchTree(brId);
  const seen=[];
  function walk(node){
    if(node.r){
      const done=rDone(node.r.id) && !node.r.rep;
      const parentDone = !node.r.req || rDone(node.r.req);
      if(done || parentDone) seen.push(node.r.id);
      if(!parentDone) return; // enfants non révélés tant que le parent n'est pas acheté
    }
    node.children.forEach(walk);
  }
  walk(stem);
  return new Set(seen);
}

function fmtNum(n){
  if(n>=1e12)return (n/1e12).toFixed(2)+'T';
  if(n>=1e9)return (n/1e9).toFixed(2)+'G';
  if(n>=1e6)return (n/1e6).toFixed(2)+'M';
  if(n>=1e3)return (n/1e3).toFixed(2)+'K';
  return Math.round(n*100)/100+'';
}
function effectText(r){
  if(r.milestone) return 'Débloque l\'étape '+r.milestone;
  if(r.dyson) return 'Ouvre un segment de la sphère de Dyson';
  if(!r.e) return r.d||'';
  const parts=[];
  if(r.e.global) parts.push('production globale ×'+r.e.global);
  if(r.e.mult) for(const k in r.e.mult) parts.push(k+' ×'+r.e.mult[k]);
  if(r.e.stage) for(const k in r.e.stage) parts.push('étape '+k+' ×'+r.e.stage[k]);
  return parts.join(', ');
}

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,html){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(html!==undefined) e.innerHTML=html;
  return e;
}

let tipEl=document.getElementById('tip');
function showTip(evt,html){
  tipEl.innerHTML=html; tipEl.classList.add('show');
  const pad=12, vw=window.innerWidth, vh=window.innerHeight;
  let x=evt.clientX+pad, y=evt.clientY+pad;
  requestAnimationFrame(()=>{
    const bw=tipEl.offsetWidth, bh=tipEl.offsetHeight;
    if(x+bw>vw-8) x=evt.clientX-bw-pad;
    if(y+bh>vh-8) y=evt.clientY-bh-pad;
    tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
  });
}
function hideTip(){ tipEl.classList.remove('show'); }

function tooltipHtml(r,st,brColor){
  const costOk = st==='buyable';
  const cost = rCost(r);
  let h='<div class="n">'+r.n+'</div>';
  if(st==='locked'){ h+='<div class="d">Verrouillé — achète le nœud précédent d\'abord.</div>'; return h; }
  h+='<div class="d">'+effectText(r)+'</div>';
  h+='<div class="row"><span class="lab">coût</span><span class="'+(costOk||st==='done'?'ok':'bad')+'">'+fmtNum(cost)+' science'+(r.rep?' (niv. '+rLevel(r.id)+')':'')+'</span></div>';
  return h;
}

function buildSvg(){
  const stage=document.getElementById('stage');
  stage.querySelector('svg')?.remove();
  const W=1600,H=1600, cx=W/2, cy=H/2;
  const svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:Math.min(W,1400),height:Math.min(H,1400)});
  const g=el('g',{transform:'translate('+cx+','+cy+')'});
  svg.appendChild(g);

  // liens + noeuds par branche
  const newlyVisible=new Set();
  BRANCHES.forEach(b=>{
    const color='var('+b.color+')';
    const labelA=b.angle*Math.PI/180;
    const labelR=BASE_R-70;
    const lab=el('text',{class:'branch-label',x:Math.cos(labelA)*labelR,y:Math.sin(labelA)*labelR,
      'text-anchor':'middle',style:'fill:'+color});
    lab.textContent=b.n;
    g.appendChild(lab);

    if(!b.active){
      // placeholder générique : simple silhouette verrouillée, pas de contenu détaillé
      const A=b.angle*Math.PI/180, r=BASE_R+STEP_R;
      const ph=el('g',{transform:'translate('+Math.cos(A)*r+','+Math.sin(A)*r+')',class:'node-hit locked'});
      ph.appendChild(el('circle',{r:15,class:'node-shape state-locked',fill:'none',stroke:color,'stroke-width':2,'stroke-dasharray':'3,3'}));
      const lock=el('g',{class:'node-lock',style:'color:'+color},iconSvg('unlock'));
      ph.appendChild(lock);
      ph.addEventListener('mouseenter',e=>showTip(e,'<div class="n">'+b.n+'</div><div class="d">Pas encore accessible — atteins d\'abord cette étape en jeu.</div>'));
      ph.addEventListener('mouseleave',hideTip);
      ph.addEventListener('click',e=>{ showTip(e,'<div class="n">'+b.n+'</div><div class="d">Pas encore accessible — atteins d\'abord cette étape en jeu.</div>'); setTimeout(hideTip,1800); });
      g.appendChild(ph);
      return;
    }

    const {nodes,links}=layoutBranch(branchTree(b.id), b.angle);
    const vis=visibleNodes(b.id);

    links.forEach(l=>{
      if(!vis.has(l.node.id)) return;
      const done=rDone(l.node.id)&&!l.node.rep || rAvail(l.node);
      g.appendChild(el('line',{class:'link'+(rDone(l.node.id)?' done':''),
        x1:l.from[0],y1:l.from[1],x2:l.to[0],y2:l.to[1],
        style:'stroke:'+(rDone(l.node.id)?color:'var(--line)')}));
    });

    nodes.forEach(nd=>{
      const r=nd.node; if(!vis.has(r.id)) return;
      const st=nodeState(r);
      const wasSeen=revealedIds.has(r.id);
      if(!wasSeen) newlyVisible.add(r.id);
      const grp=el('g',{transform:'translate('+nd.x+','+nd.y+')',
        class:'node-group node-hit'+(st==='locked'?' locked':'')+(!wasSeen?' revealing':'')});
      const type=nodeIconType(r);
      const shape=el('g',{class:'node-shape state-'+st,style:'color:'+color},iconSvg(type,r));
      grp.appendChild(shape);
      if(st==='done'){ grp.appendChild(el('g',{class:'node-check',style:'color:'+color,transform:'translate(7,-7) scale(.6)'},'<circle r="6" fill="'+color+'"/><path d="M-3,0 l2,2.3 4,-4.6" stroke="var(--navy-900)" stroke-width="1.6" fill="none"/>')); }
      grp.addEventListener('mouseenter',e=>showTip(e,tooltipHtml(r,st,color)));
      grp.addEventListener('mousemove',e=>showTip(e,tooltipHtml(r,st,color)));
      grp.addEventListener('mouseleave',hideTip);
      grp.addEventListener('click',e=>{
        if(st==='buyable'){ buyNode(r.id); }
        else{ showTip(e,tooltipHtml(r,st,color)); setTimeout(hideTip,1800); }
      });
      g.appendChild(grp);
    });
  });

  // noeud racine
  const rootDone=SAVE.state.recherche.root;
  const rootSt=rootDone?'done':(sci()>=1?'buyable':'dim');
  const root=el('g',{class:'node-hit'+(rootDone?'':''),transform:'translate(0,0)'});
  root.appendChild(el('circle',{r:20,class:'root-shape state-'+rootSt}));
  root.appendChild(el('g',{style:'color:var(--brass)'},iconSvg('root')));
  root.addEventListener('mouseenter',e=>showTip(e, rootDone
    ? '<div class="n">Premier Contact</div><div class="d">Acheté — les branches sont ouvertes.</div>'
    : '<div class="n">Premier Contact</div><div class="d">Débloque l\'accès aux branches de recherche.</div><div class="row"><span class="lab">coût</span><span class="'+(sci()>=1?'ok':'bad')+'">1 science</span></div>'));
  root.addEventListener('mousemove',e=>showTip(e, rootDone
    ? '<div class="n">Premier Contact</div><div class="d">Acheté — les branches sont ouvertes.</div>'
    : '<div class="n">Premier Contact</div><div class="d">Débloque l\'accès aux branches de recherche.</div><div class="row"><span class="lab">coût</span><span class="'+(sci()>=1?'ok':'bad')+'">1 science</span></div>'));
  root.addEventListener('mouseleave',hideTip);
  root.addEventListener('click',()=>{ if(!rootDone) buyRoot(); });
  g.appendChild(root);

  stage.appendChild(svg);
  revealedIds = new Set([...revealedIds, ...newlyVisible, ...(rootDone?['__root__']:[])]);
  setTimeout(()=>{ document.querySelectorAll('.node-group.revealing').forEach(n=>n.classList.remove('revealing')); },800);
}

function fullRender(){
  ensureShape();
  document.getElementById('sciVal').textContent=fmtNum(sci());
  buildSvg();
}

document.getElementById('closeBtn').onclick=()=>{
  try{ parent.postMessage({type:'recherche:close'},'*'); }catch(e){}
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ try{ parent.postMessage({type:'recherche:close'},'*'); }catch(err){} } });

(async()=>{
  SAVE=await loadSave();
  ensureShape();
  fullRender();
})();
</script>
</body>
</html>
