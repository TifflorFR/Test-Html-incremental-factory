<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbre de recherche</title>
<style>
:root{
  --navy-900:#070d16; --navy-800:#0b1522; --navy-700:#101e30; --navy-600:#16293f;
  --line:#1e3149;
  --brass:#c9963f; --brass-dim:#8a6829;
  --ember:#e8703a; --ember-dim:#7d3a1c;
  --steel:#8fa8bf; --ink:#dfe9f2;
  --ok:#5fb87a; --warn:#d8a13c; --bad:#c5533f;
  /* accent par branche — décliné sur navy/laiton/ember */
  --br-spine:#c9963f;
  --br-extraction:#4fa8c9;
  --br-industrie:#e8703a;
  --br-spatial:#9b8fd9;
  --br-expansion:#6bd0a3;
  --br-placeholder:#3c4f66;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    linear-gradient(rgba(120,170,220,.05) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, rgba(120,170,220,.05) 1px, transparent 1px) 0 0/32px 32px,
    radial-gradient(900px 600px at 70% -10%, #14263c 0%, var(--navy-900) 60%);
  color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px; overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}

#top{
  flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:10px 14px; border-bottom:1px solid var(--line); background:rgba(7,13,22,.9);
}
#top .t{font-size:13px;letter-spacing:.1em;color:var(--brass)}
#top .sci{margin-left:auto;font-size:12px;color:var(--steel)}
#top .sci b{color:var(--ink)}
#top .close{border:1px solid var(--line);padding:6px 12px;font-size:11px;letter-spacing:.08em;
  color:var(--steel);border-radius:2px}
#top .close:active{border-color:var(--brass-dim);color:var(--ink)}

/* La carte défile : à 20 nœuds, tout faire tenir dans un écran de téléphone
   réduirait les nœuds à ~16 px, intouchables. On fixe donc une échelle lisible
   (PX_PER_UNIT) et on laisse l'utilisateur naviguer ; la vue s'ouvre centrée sur
   la racine. */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#stage svg{display:block;margin:auto;touch-action:pan-x pan-y}

.link{fill:none;stroke:var(--line);stroke-width:3}
.spoke{fill:none;stroke-width:2.5;opacity:.22}

.node-hit{cursor:pointer}
.node-shape{transition:opacity .25s}
.state-locked .node-shape{opacity:.3}
.state-dim .node-shape{opacity:.6}
.state-buyable .node-shape{opacity:1}
.state-done .node-shape{opacity:.92}

@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.state-buyable .halo-pulse{animation:pulse 2.6s ease-in-out infinite}

@keyframes reveal{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
.revealing{animation:reveal .65s ease-out;transform-origin:center}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shaking{animation:shake .38s ease-in-out}

@media(prefers-reduced-motion:reduce){
  .state-buyable .halo-pulse,.revealing,.shaking{animation:none}
}

/* panneau fixe en bas — jamais ancré au nœud, donc jamais de débordement en bord d'écran */
#sheet{
  flex:0 0 auto; border-top:1px solid var(--brass-dim); background:var(--navy-800);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:none;
}
#sheet.show{display:block}
#sheet .sn{font-size:14px;color:var(--ink);margin-bottom:4px}
#sheet .sd{font-size:12px;color:var(--steel);line-height:1.5;margin-bottom:8px}
#sheet .srow{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:3px}
#sheet .lab{color:var(--steel)}
#sheet .ok{color:var(--ok)}
#sheet .bad{color:var(--bad)}
#sheet .hintline{margin-top:9px;font-size:11px;color:var(--brass);letter-spacing:.04em}
#sheet .hintline.muted{color:#5b7691}
@keyframes costflash{0%,100%{background:transparent}30%{background:rgba(197,83,63,.28)}}
#sheet .costflash{animation:costflash .5s ease-out;border-radius:2px;padding:0 3px;margin:0 -3px}
</style>
</head>
<body>
<div id="top">
  <div class="t">ARBRE DE RECHERCHE</div>
  <div class="sci">science : <b id="sciVal">0</b></div>
  <button class="close" id="closeBtn">✕ fermer</button>
</div>
<div id="stage"></div>
<div id="sheet"></div>

<script>
/* ==========================================================================
   Copie fidèle de l'arbre calibré dans index.html (const RTREE). Même source de
   vérité, dupliquée parce que ce fichier est autonome : toute modification de coût
   ou d'effet doit être répercutée des deux côtés.
   ========================================================================== */
const RTREE=[
  /* ÉPINE DORSALE — 8 paliers depuis 0.4.0 (5 auparavant).
     B1, B3 et B4 n'avaient aucun effet mécanique : c'étaient des péages nus, et les trois
     seuls paliers de l'étape 7 tenaient sur 0,7 ordre de grandeur, franchis en rafale.
     Chaque nœud porte désormais un effet réel, et B1b / B3b / B4b intercalent des paliers
     intermédiaires. Deux bénéfices : l'attente est ponctuée d'achats utiles, et la science
     continue de croître pendant l'étape 7 — donc le jalon B5 tombe sur une portion PENTUE
     de la courbe, où un écart de coût se traduit par un écart de durée proportionné.
     Calibré par simulation : étape 6 = 47,5 min (cible 50), étape 7 = 78,8 min (cible 85). */
  {id:'B1', br:'spine',n:'Vaisseaux rudimentaires', sci:2480,      req:null,  e:{mult:{lab:2}},   d:'Ouvre la construction de vaisseaux coloniaux. Laboratoires ×2.'},
  {id:'B1b',br:'spine',n:'Alliages en apesanteur',  sci:60000,     req:'B1',  e:{global:1.5},     d:'Alliages coulés en apesanteur. Production globale ×1,5.'},
  {id:'B2', br:'spine',n:'Colonisation',            sci:4e11,      req:'B1b', d:'JALON — débloque l\'étape 7.', milestone:7},
  {id:'B3', br:'spine',n:'Voyage interstellaire',   sci:2e12,      req:'B2',  e:{mult:{lab:3}},   d:'Ouvre la portée interstellaire. Laboratoires ×3.'},
  {id:'B3b',br:'spine',n:'Réacteur à confinement',  sci:2e13,      req:'B3',  e:{global:2},       d:'Fusion compacte embarquée. Production globale ×2.'},
  {id:'B4', br:'spine',n:'Vaisseaux avancés',       sci:2e14,      req:'B3b', e:{mult:{lab:3}},   d:'Coques capables de distorsion. Laboratoires ×3.'},
  {id:'B4b',br:'spine',n:'Cartographie stellaire',  sci:2e15,      req:'B4',  e:{global:2.5},     d:'Relevé complet du bras local. Production globale ×2,5.'},
  {id:'B5', br:'spine',n:'Colonisation avancée',    sci:3e16,      req:'B4b', d:'JALON — débloque l\'étape 8.', milestone:8},
  {id:'ND1',br:'spatial',n:'Chantier Dyson 1',sci:745,     req:null, dyson:'D1', d:'Ouvre le premier segment de la sphère.'},
  {id:'ND2',br:'spatial',n:'Chantier Dyson 2',sci:14500,   req:'ND1',dyson:'D2', d:'Deuxième segment.'},
  {id:'ND3',br:'spatial',n:'Chantier Dyson 3',sci:41500,   req:'ND2',dyson:'D3', d:'Troisième segment.'},
  {id:'ND4',br:'spatial',n:'Chantier Dyson 4',sci:3730000, req:'ND3',dyson:'D4', d:'Quatrième segment.'},
  {id:'ND5',br:'spatial',n:'Chantier Dyson 5',sci:10300000,req:'ND4',dyson:'D5', d:'Cinquième segment.'},
  {id:'ND6',br:'spatial',n:'Chantier Dyson 6',sci:27500000,req:'ND5',dyson:'D6', d:'Dernier segment.'},
  {id:'E1',br:'extraction',n:'Forage téléopéré',   sci:220, req:null, e:{stage:{1:3}},        d:'Extraction ×3.'},
  {id:'E2',br:'extraction',n:'Veines profondes',   sci:900, req:'E1', e:{stage:{1:4}},        d:'Extraction ×4.'},
  {id:'I1',br:'industrie', n:'Métallurgie orbitale',sci:260,req:null, e:{stage:{2:3,3:3}},    d:'Fonderie et usine ×3.'},
  {id:'I2',br:'industrie', n:'Cadence prédictive', sci:1100,req:'I1', e:{stage:{4:3,5:3}},    d:'National et international ×3.'},
  {id:'I3',br:'industrie', n:'Standardisation totale',sci:5200,req:'I2',e:{global:2},         d:'Production globale ×2.'},
  {id:'S1',br:'spatial',   n:'Assemblage en apesanteur',sci:300,req:null,e:{mult:{lab:2}},d:'Laboratoires ×2.'},
  {id:'S2',br:'spatial',   n:'Théorie unifiée',    sci:2400,req:'S1', e:{global:2},           d:'Production globale ×2.'},
  {id:'RS',br:'spatial',   n:'Optimisation de la recherche',sci:220,req:'S2',rep:true,repMult:2.0,e:{mult:{lab:1.15}},d:'+15 % de science par niveau. Le coût double à chaque niveau : le rendement s\'épuise vite, c\'est voulu.'},
  {id:'RI',br:'industrie', n:'Optimisation industrielle',   sci:260,req:'I3',rep:true,repMult:1.62,e:{stage:{5:1.22}},     d:'+22 % de production d\'étape 5 par niveau.'},

  // --- expansion : vitesse de colonisation ---
  {id:'X1',br:'expansion',n:'Sondes autonomes',      sci:1.5e16, req:'B5',rep:false,e:{colon:3},   d:'Des sondes qui se guident seules, sans relais depuis la Terre. Colonisation ×3.'},
  {id:'X2',br:'expansion',n:'Relais de distorsion',  sci:8e16, req:'X1',e:{colon:2.5}, d:'Un maillage de balises qui raccourcit chaque saut. Colonisation ×2,5.'},
  {id:'X3',br:'expansion',n:'Essaim von Neumann',    sci:2e17, req:'X2',e:{colon:2},   d:'Chaque vaisseau arrivé en construit deux autres sur place. Colonisation ×2.'},
  {id:'X4',br:'expansion',n:'Portails stables',      sci:4e17, req:'X3',e:{colon:1.6}, d:"Des portes fixes : plus besoin de traverser, il suffit d'ouvrir. Colonisation ×1,6."},
  {id:'X5',br:'expansion',n:'Conscience distribuée', sci:6.2e17, req:'X4',e:{colon:1.4}, d:"L'essaim décide seul où aller. Tu ne pilotes plus, tu regardes. Colonisation ×1,4."},
  {id:'RX',br:'expansion',n:"Réglage de l'essaim",   sci:7.6e17, req:'X5',rep:true,repMult:2.0,e:{colon:1.35}, d:'+35 % de vitesse de colonisation par niveau.'},
];
const RBY={}; RTREE.forEach(r=>RBY[r.id]=r);

/* Structure réelle : 5 branches (l'arbre existant ne distingue pas une branche par
   étape — « Industrie » couvre Fonderie/Usine/National/International, « Spatial »
   contient deux chaînes indépendantes Dyson + labo). 1 placeholder pour l'étape 7 :
   la Colonisation n'a pas de branche dédiée, son jalon (B2) vit sur l'épine dorsale. */
const BRANCHES=[
  {id:'spine',       n:'Épine dorsale', angle:-90, color:'--br-spine',      active:true},
  {id:'extraction',  n:'Extraction',    angle:-30, color:'--br-extraction', active:true},
  {id:'industrie',   n:'Industrie',     angle:30,  color:'--br-industrie',  active:true},
  {id:'spatial',     n:'Spatial',       angle:90,  color:'--br-spatial',    active:true},
  {id:'colonisation',n:'Colonisation',  angle:150, color:'--br-placeholder',active:false, stage:7},
  {id:'expansion',   n:'Expansion',     angle:210, color:'--br-expansion',  active:true},
];

/* Condition d'étape : dérivée de la chaîne de jalons. Un nœud situé après un jalon
   qui débloque l'étape X requiert d'avoir atteint X. En pratique le jalon garantit
   déjà l'étape, donc la condition est informative — elle n'ajoute pas de blocage
   qui n'existerait pas dans index.html. */
function stageCond(r){
  let cur=r, guard=0;
  while(cur && guard++<40){
    if(!cur.req) return null;
    const p=RBY[cur.req];
    if(!p) return null;
    if(p.milestone) return p.milestone;
    cur=p;
  }
  return null;
}
/* la condition n'est affichée que sur le ou les PREMIERS nœuds de la branche qui
   la nécessitent : ses enfants directs héritent de la même étape, inutile de la répéter */
function showsCond(r){
  const c=stageCond(r); if(!c) return null;
  const parent=r.req?RBY[r.req]:null;
  if(parent && parent.milestone===c) return c;   // enfant direct du jalon : on affiche
  return null;
}

/* Icônes par FONCTION, réutilisées d'une branche à l'autre. La forme est fixe ;
   seuls couleur et opacité varient selon l'état (CSS). */
function iconType(r){
  if(!r) return 'root';
  if(r.milestone) return 'milestone';
  if(r.dyson) return 'segment';
  if(r.rep) return 'repeat';
  if(r.e && r.e.global) return 'global';
  if(r.e && r.e.mult) return 'machine';
  if(r.e && r.e.stage) return 'stage';
  if(r.e && r.e.colon) return 'stage';
  return 'unlock';
}
function iconSvg(type){
  switch(type){
    case 'root':      return '<circle r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><circle r="3" fill="currentColor"/>';
    case 'unlock':    return '<rect x="-7" y="-5" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-4,-5 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="currentColor" stroke-width="2"/>';
    case 'milestone': return '<path d="M-6,8 V-8 l12,4 -12,4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
    case 'segment':   return '<circle r="8.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".4"/><path d="M0,-8.5 A8.5,8.5 0 0 1 7.4,4.2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    case 'stage':     return '<circle r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5,-6.5 l4,-2 -1,4.4z" fill="currentColor"/>';
    case 'global':    return '<circle r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-7.5,0 H7.5 M0,-7.5 V7.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M-5,-4.8 Q0,-1.4 5,-4.8 M-5,4.8 Q0,1.4 5,4.8" fill="none" stroke="currentColor" stroke-width="1.2"/>';
    case 'machine':   return '<circle r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M0,-8 V-5"/><path d="M0,8 V5"/><path d="M-8,0 H-5"/><path d="M8,0 H5"/><path d="M-5.7,-5.7 l2.1,2.1"/><path d="M5.7,5.7 l-2.1,-2.1"/><path d="M-5.7,5.7 l2.1,-2.1"/><path d="M5.7,-5.7 l-2.1,2.1"/></g>';
    case 'repeat':    return '<path d="M6,-1 A6.5,6.5 0 1 0 4.5,4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6,-6 v5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
    default:          return '<circle r="6" fill="none" stroke="currentColor" stroke-width="2"/>';
  }
}

/* ==========================================================================
   Sauvegarde partagée avec index.html (même clé, même format). Sous-objet dédié
   state.recherche pour ce qui est propre à cette page.
   ========================================================================== */
const SAVE_KEY='if:save', OLD_KEY='bn:save';
async function loadSave(){
  try{
    if(window.storage&&window.storage.get){
      const r=await window.storage.get(SAVE_KEY); if(r&&r.value) return JSON.parse(r.value);
      const o=await window.storage.get(OLD_KEY);  if(o&&o.value) return JSON.parse(o.value);
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(OLD_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
async function writeSave(d){
  d.ts=Date.now();
  const raw=JSON.stringify(d);
  try{ if(window.storage&&window.storage.set){ await window.storage.set(SAVE_KEY,raw); return; } }catch(e){}
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
}

let SAVE=null;
let armedId=null;            // nœud sélectionné : un 2e clic dessus tente l'achat
let revealed=new Set();      // nœuds déjà apparus (pour ne flasher que les nouveaux)
let firstPaint=true;

function ensureShape(){
  SAVE=SAVE||{v:1,state:{}};
  const s=SAVE.state=SAVE.state||{};
  s.research=s.research||{}; s.res=s.res||{}; s.res.science=s.res.science||0;
  s.dyson=s.dyson||{}; s.recherche=s.recherche||{root:false}; s.stage=s.stage||1;
}
const rLevel=id=>SAVE.state.research[id]||0;
const rDone=id=>rLevel(id)>0;
const rAvail=r=>(!r.req||rDone(r.req))&&(r.rep||!rDone(r.id));
const rCost=r=>r.rep?Math.round(r.sci*Math.pow(r.repMult,rLevel(r.id))):r.sci;
const sci=()=>SAVE.state.res.science||0;
const stageOK=r=>{ const c=stageCond(r); return !c || SAVE.state.stage>=c; };

function nodeState(r){
  if(!SAVE.state.recherche.root) return 'locked';
  if(rDone(r.id)&&!r.rep) return 'done';
  if(!rAvail(r)) return 'locked';
  if(!stageOK(r)) return 'locked';
  return sci()>=rCost(r) ? 'buyable' : 'dim';
}

/* arbre d'une branche : le parent est le prérequis s'il appartient à la même branche,
   sinon le nœud part directement de la racine (permet les embranchements multiples) */
function branchTree(brId){
  const byParent={};
  RTREE.filter(r=>r.br===brId).forEach(r=>{
    const p=(r.req&&RBY[r.req]&&RBY[r.req].br===brId)?r.req:'__stem__';
    (byParent[p]=byParent[p]||[]).push(r);
  });
  const build=id=>({r:RBY[id]||null,children:(byParent[id]||[]).map(c=>build(c.id))});
  return {r:null,children:(byParent['__stem__']||[]).map(c=>build(c.id))};
}
/* visibilité progressive : nœuds achetés + enfants directs du dernier acheté */
function visibleNodes(brId){
  const out=new Set();
  (function walk(node){
    if(node.r){
      const parentDone=!node.r.req||rDone(node.r.req);
      if(rDone(node.r.id)||parentDone) out.add(node.r.id);
      if(!parentDone) return;          // on ne descend pas sous un nœud non acheté
    }
    node.children.forEach(walk);
  })(branchTree(brId));
  return out;
}

const BASE_R=38, STEP_R=40, STEP_R2=64, SECTOR=50, NODE_R=20, ICON_SCALE=1.35;
const PX_PER_UNIT=1.7;   // racine + 1er niveau tiennent dans un écran de téléphone sans défiler
// rayon d'un nœud selon sa profondeur : le 1er niveau reste resserré (contrainte d'écran
// initial), au-delà l'écart grandit — sinon les nœuds d'une même chaîne (ex. les 6 chantiers
// Dyson) finissent bord à bord voire chevauchés.
const radiusAt=depth=>depth<=1 ? BASE_R+depth*STEP_R : BASE_R+STEP_R+(depth-1)*STEP_R2;
function layoutBranch(brId, centerAngle){
  const nodes=[], links=[];
  (function place(node,a0,a1,depth,parentXY){
    const mid=(a0+a1)/2;
    let xy=parentXY;
    if(node.r){
      const A=mid*Math.PI/180, rad=radiusAt(depth);
      xy=[Math.cos(A)*rad, Math.sin(A)*rad];
      nodes.push({r:node.r,x:xy[0],y:xy[1]});
      if(parentXY) links.push({from:parentXY,to:xy,r:node.r});
    }
    const n=node.children.length; if(!n) return;
    const span=(a1-a0)/n;
    node.children.forEach((c,i)=>place(c,a0+i*span,a0+(i+1)*span,depth+1,xy||parentXY));
  })(branchTree(brId), centerAngle-SECTOR/2, centerAngle+SECTOR/2, 0, null);
  return {nodes,links};
}

function fmtNum(n){
  if(n>=1e12)return (n/1e12).toFixed(2)+'T';
  if(n>=1e9) return (n/1e9).toFixed(2)+'G';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(2)+'K';
  return String(Math.round(n*100)/100);
}
function effectText(r){
  if(r.milestone) return 'Débloque l\'étape '+r.milestone+'.';
  if(r.dyson) return 'Ouvre un segment de la sphère de Dyson.';
  if(!r.e) return r.d||'';
  const p=[];
  if(r.e.global) p.push('production globale ×'+r.e.global);
  if(r.e.mult) for(const k in r.e.mult) p.push(k+' ×'+r.e.mult[k]);
  if(r.e.stage) for(const k in r.e.stage) p.push('étape '+k+' ×'+r.e.stage[k]);
  if(r.e.colon) p.push('vitesse de colonisation ×'+r.e.colon);
  return p.join(', ')+'.';
}

/* --------------------------------------------------------------------------
   Panneau fixe (bottom sheet) — remplace tout tooltip ancré au nœud
   -------------------------------------------------------------------------- */
const sheet=document.getElementById('sheet');
function renderSheet(r,opts){
  opts=opts||{};
  if(!r){ sheet.className=''; sheet.innerHTML=''; return; }
  const st=nodeState(r), cost=rCost(r), cond=showsCond(r);
  const enough=sci()>=cost;
  let h='<div class="sn">'+r.n+(r.rep&&rLevel(r.id)?' · niveau '+rLevel(r.id):'')+'</div>';
  h+='<div class="sd">'+effectText(r)+'</div>';
  if(st==='done'){
    h+='<div class="srow"><span class="lab">état</span><span class="ok">acquise</span></div>';
  }else{
    h+='<div class="srow"><span class="lab">coût</span>'+
       '<span class="'+(enough?'ok':'bad')+(opts.flash?' costflash':'')+'">'+fmtNum(cost)+' science</span></div>';
    if(cond!==null){
      const ok=SAVE.state.stage>=cond;
      h+='<div class="srow"><span class="lab">condition</span><span class="'+(ok?'ok':'bad')+'">étape '+cond+(ok?' atteinte':' requise')+'</span></div>';
    }
    if(!rAvail(r)&&!rDone(r.id)){
      h+='<div class="srow"><span class="lab">requiert</span><span class="bad">'+(r.req?RBY[r.req].n:'—')+'</span></div>';
    }
  }
  const canBuy = st==='buyable';
  h+='<div class="hintline'+(canBuy?'':' muted')+'">'+
     (st==='done' ? 'Déjà acquise.' : canBuy ? 'Touche à nouveau ce nœud pour lancer la recherche.'
      : !rAvail(r) ? 'Achète d\'abord le nœud précédent.'
      : !stageOK(r) ? 'Atteins l\'étape requise en jeu.'
      : 'Science insuffisante.')+'</div>';
  sheet.innerHTML=h; sheet.className='show';
}
function shakeSheet(){
  sheet.classList.remove('shaking');
  void sheet.offsetWidth;              // force le redémarrage de l'animation
  sheet.classList.add('shaking');
  setTimeout(()=>sheet.classList.remove('shaking'),420);
}

/* -------------------------------------------------------------------------- */
async function buyRoot(){
  if(SAVE.state.recherche.root||sci()<1) return false;
  SAVE.state.res.science-=1; SAVE.state.recherche.root=true;
  await writeSave(SAVE); return true;
}
async function buyNode(id){
  const r=RBY[id];
  if(!r||!SAVE.state.recherche.root||nodeState(r)!=='buyable') return false;
  SAVE.state.res.science-=rCost(r);
  SAVE.state.research[id]=rLevel(id)+1;
  if(r.dyson) SAVE.state.dyson[r.dyson]={open:true,paid:0,running:false,done:false};
  await writeSave(SAVE); return true;
}

/* clic-clic : 1er clic arme et détaille, 2e clic sur le MÊME nœud tente l'achat.
   Cliquer ailleurs ou un autre nœud désarme et repart au 1er clic. */
async function onNodeClick(r){
  if(armedId!==r.id){ armedId=r.id; renderSheet(r); draw(); return; }
  const st=nodeState(r);
  if(st==='buyable'){
    if(await buyNode(r.id)){ armedId=null; renderSheet(null); draw(); }
  }else if(st==='done'){
    renderSheet(r);                    // lecture seule, aucune action
  }else{
    renderSheet(r,{flash:true}); shakeSheet();   // refus : shake + flash rouge sur le coût
  }
}
async function onRootClick(){
  if(SAVE.state.recherche.root){ armedId=null; renderSheet(null); draw(); return; }
  if(armedId!=='__root__'){
    armedId='__root__';
    sheet.innerHTML='<div class="sn">Premier Contact</div>'+
      '<div class="sd">Ouvre l\'accès aux branches de recherche et révèle le premier nœud de chacune.</div>'+
      '<div class="srow"><span class="lab">coût</span><span class="'+(sci()>=1?'ok':'bad')+'">1 science</span></div>'+
      '<div class="hintline'+(sci()>=1?'':' muted')+'">'+(sci()>=1?'Touche à nouveau pour lancer la recherche.':'Science insuffisante.')+'</div>';
    sheet.className='show'; draw(); return;
  }
  if(await buyRoot()){ armedId=null; renderSheet(null); draw(); }
  else{
    sheet.querySelector('.srow span:last-child').classList.add('costflash');
    shakeSheet();
  }
}
function clearArmed(){ if(armedId!==null){ armedId=null; renderSheet(null); draw(); } }

/* -------------------------------------------------------------------------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,html){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(html!==undefined) e.innerHTML=html;
  return e;
}
function nodeGroup(r,x,y,color,isNew){
  const st=nodeState(r);
  // le positionnement (attribut SVG transform="translate(x,y)") et l'animation de reveal
  // (CSS transform: scale(...)) doivent vivre sur deux <g> DIFFÉRENTS : un transform CSS
  // sur un élément remplace entièrement son transform attribut, pas ne compose pas avec
  // lui — sinon le nœud est translaté à (0,0) pendant toute l'animation et "flashe" au
  // centre avant de sauter à sa vraie place.
  const g=el('g',{transform:'translate('+x+','+y+')', class:'node-hit state-'+st});
  const inner=el('g',{class:isNew?'revealing':''});
  g.appendChild(inner);
  const S=NODE_R;   // demi-côté du carré
  if(armedId===r.id) inner.appendChild(el('rect',{x:-S-7,y:-S-7,width:2*(S+7),height:2*(S+7),rx:8,
    fill:'none',stroke:color,'stroke-width':2,opacity:.85}));
  if(st==='buyable') inner.appendChild(el('rect',{class:'halo-pulse',x:-S,y:-S,width:2*S,height:2*S,rx:6,
    fill:'none',stroke:color,'stroke-width':2}));
  // zone tactile confortable, indépendante de la taille visuelle du carré
  inner.appendChild(el('rect',{x:-S-10,y:-S-10,width:2*(S+10),height:2*(S+10),fill:'transparent'}));
  inner.appendChild(el('rect',{class:'node-shape',x:-S+3,y:-S+3,width:2*(S-3),height:2*(S-3),rx:5,
    fill:'var(--navy-800)',stroke:color,'stroke-width':st==='done'?3:2,
    'stroke-dasharray':st==='locked'?'5,4':''}));
  inner.appendChild(el('g',{class:'node-shape',style:'color:'+color,
    transform:'scale('+ICON_SCALE+')'},iconSvg(iconType(r))));
  if(st==='done'){
    inner.appendChild(el('g',{transform:'translate('+(S-6)+',-'+(S-6)+') scale(1.3)'},
      '<circle r="7" fill="'+color+'"/><path d="M-3.2,0 l2.2,2.5 4.3,-5" stroke="var(--navy-900)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'));
  }
  if(st==='locked'){
    inner.appendChild(el('g',{transform:'translate('+(S-6)+',-'+(S-8)+') scale(1.15)',style:'color:'+color,opacity:.9},
      '<rect x="-5" y="-3.5" width="10" height="8" rx="1.2" fill="var(--navy-900)" stroke="currentColor" stroke-width="1.6"/><path d="M-2.8,-3.5 v-2.2 a2.8,2.8 0 0 1 5.6,0 v2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'));
  }
  g.addEventListener('click',ev=>{ ev.stopPropagation(); onNodeClick(r); });
  return g;
}

function draw(){
  const stage=document.getElementById('stage');
  // on ne recentre qu'au tout premier rendu : sinon chaque achat ramènerait
  // brutalement la vue sur la racine
  const keepScroll = firstPaint ? null : {l:stage.scrollLeft, t:stage.scrollTop};
  stage.innerHTML='';
  const svg=el('svg',{preserveAspectRatio:'xMidYMid meet'});
  const g=el('g',{});
  svg.appendChild(g);
  svg.addEventListener('click',clearArmed);

  let minX=-BASE_R,maxX=BASE_R,minY=-BASE_R,maxY=BASE_R;
  const track=(x,y)=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; };
  const fresh=[];

  BRANCHES.forEach(b=>{
    const color='var('+b.color+')';
    const A=b.angle*Math.PI/180;

    if(!b.active){
      const x=Math.cos(A)*(BASE_R+STEP_R), y=Math.sin(A)*(BASE_R+STEP_R);
      g.appendChild(el('line',{class:'spoke',x1:0,y1:0,x2:x,y2:y,style:'stroke:'+color}));
      const S=NODE_R;
      const ph=el('g',{transform:'translate('+x+','+y+')',class:'node-hit state-locked'});
      ph.appendChild(el('rect',{x:-S-10,y:-S-10,width:2*(S+10),height:2*(S+10),fill:'transparent'}));
      ph.appendChild(el('rect',{class:'node-shape',x:-S+3,y:-S+3,width:2*(S-3),height:2*(S-3),rx:5,
        fill:'var(--navy-800)',stroke:color,'stroke-width':2,'stroke-dasharray':'5,4'}));
      ph.appendChild(el('g',{class:'node-shape',style:'color:'+color,transform:'scale('+ICON_SCALE+')'},iconSvg('unlock')));
      ph.addEventListener('click',ev=>{ ev.stopPropagation(); armedId=null;
        sheet.innerHTML='<div class="sn">'+b.n+'</div>'+
          '<div class="sd">Cette branche n\'est pas encore ouverte.</div>'+
          '<div class="srow"><span class="lab">condition</span><span class="bad">étape '+b.stage+' requise</span></div>'+
          '<div class="hintline muted">Atteins l\'étape '+b.stage+' en jeu pour la débloquer.</div>';
        sheet.className='show'; draw(); });
      g.appendChild(ph); track(x,y);
      return;
    }

    const {nodes,links}=layoutBranch(b.id,b.angle);
    const vis=visibleNodes(b.id);
    // rayon discret du centre vers chaque point d'entrée de la branche (même avant tout
    // achat) : structure hub-and-spoke lisible sans le moindre texte
    const entries=RTREE.filter(rr=>rr.br===b.id&&(!rr.req||(RBY[rr.req]&&RBY[rr.req].br!==b.id)));
    entries.forEach(rr=>{ const nd=nodes.find(n=>n.r.id===rr.id); if(nd)
      g.appendChild(el('line',{class:'spoke',x1:0,y1:0,x2:nd.x,y2:nd.y,style:'stroke:'+color})); });

    links.forEach(l=>{ if(!vis.has(l.r.id))return;
      g.appendChild(el('line',{class:'link',x1:l.from[0],y1:l.from[1],x2:l.to[0],y2:l.to[1],
        style:rDone(l.r.id)?'stroke:'+color:''})); });

    nodes.forEach(nd=>{ if(!vis.has(nd.r.id))return;
      const isNew=!firstPaint&&!revealed.has(nd.r.id);
      if(isNew) fresh.push(nd.r.id);
      g.appendChild(nodeGroup(nd.r,nd.x,nd.y,color,isNew));
      track(nd.x,nd.y); });
  });

  // racine — carré comme le reste, légèrement plus grand pour marquer le centre
  const rootDone=SAVE.state.recherche.root;
  const rootSt=rootDone?'done':(sci()>=1?'buyable':'dim');
  const RS=NODE_R+4;
  const root=el('g',{class:'node-hit state-'+rootSt});
  if(armedId==='__root__') root.appendChild(el('rect',{x:-RS-9,y:-RS-9,width:2*(RS+9),height:2*(RS+9),rx:9,
    fill:'none',stroke:'var(--brass)','stroke-width':2,opacity:.85}));
  if(rootSt==='buyable') root.appendChild(el('rect',{class:'halo-pulse',x:-RS-3,y:-RS-3,width:2*(RS+3),height:2*(RS+3),rx:8,
    fill:'none',stroke:'var(--brass)','stroke-width':2}));
  root.appendChild(el('rect',{x:-RS-12,y:-RS-12,width:2*(RS+12),height:2*(RS+12),fill:'transparent'}));
  root.appendChild(el('rect',{class:'node-shape',x:-RS,y:-RS,width:2*RS,height:2*RS,rx:7,
    fill:'var(--navy-700)',stroke:'var(--brass)','stroke-width':3}));
  root.appendChild(el('g',{class:'node-shape',style:'color:var(--brass)',transform:'scale('+(ICON_SCALE+.15)+')'},iconSvg('root')));
  root.addEventListener('click',ev=>{ ev.stopPropagation(); onRootClick(); });
  g.appendChild(root);

  // emprise réelle des nœuds visibles, à échelle fixe lisible ; la carte grandit
  // au fil des révélations et reste navigable au doigt
  const pad=NODE_R+22;
  const vx=minX-pad, vy=minY-pad, vw=(maxX-minX)+pad*2, vh=(maxY-minY)+pad*2;
  svg.setAttribute('viewBox',vx+' '+vy+' '+vw+' '+vh);
  svg.setAttribute('width',Math.round(vw*PX_PER_UNIT));
  svg.setAttribute('height',Math.round(vh*PX_PER_UNIT));
  stage.appendChild(svg);

  // garder la vue stable entre deux redessins ; à l'ouverture, centrer sur la racine
  if(keepScroll){ stage.scrollLeft=keepScroll.l; stage.scrollTop=keepScroll.t; }
  else{
    stage.scrollLeft=(-vx)*PX_PER_UNIT-stage.clientWidth/2;
    stage.scrollTop =(-vy)*PX_PER_UNIT-stage.clientHeight/2;
  }

  fresh.forEach(id=>revealed.add(id));
  firstPaint=false;
}

function fullRender(){
  ensureShape();
  document.getElementById('sciVal').textContent=fmtNum(sci());
  // au premier rendu, tout ce qui est déjà visible ne doit pas flasher
  if(firstPaint) BRANCHES.filter(b=>b.active).forEach(b=>visibleNodes(b.id).forEach(id=>revealed.add(id)));
  draw();
}

document.getElementById('closeBtn').onclick=()=>{ try{ parent.postMessage({type:'recherche:close'},'*'); }catch(e){} };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(armedId!==null){ clearArmed(); return; }
    try{ parent.postMessage({type:'recherche:close'},'*'); }catch(err){} }
});
document.getElementById('sheet').addEventListener('click',e=>e.stopPropagation());
document.body.addEventListener('click',clearArmed);

(async()=>{ SAVE=await loadSave(); ensureShape(); fullRender(); })();
</script>
</body>
